name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: install node and python deps
        run: |
          npm ci
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: build the example course
        run: python3 scripts/build.py content/example

      - name: run the harness
        run: npm test

      - name: keep the screenshots and the pdf
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            build/shots/
            build/example-sheet.pdf
            build/example.html
          if-no-files-found: ignore

      - name: build the demo page with the pdf embedded
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python3 scripts/build.py content/example --pdf build/example-sheet.pdf
          mkdir -p pages && cp build/example-preview.html pages/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
